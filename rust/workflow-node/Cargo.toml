[package]
name = "workflow-node"
version = "0.1.0"
edition = "2021"
description = "SDK for writing WORKFLOW community nodes in Rust that compile to a sandboxed WASM module. Hides the guest<->host ABI so an author writes only the node's contract, logic and UI."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# This is a library dependency for node crates (which are themselves `cdylib`s). It has no
# platform-specific code and builds for both the host (for `cargo test`/manifest emit) and
# `wasm32-unknown-unknown` (the real target the engine sandbox runs).
